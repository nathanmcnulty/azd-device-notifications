name: Validate template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Test, typecheck, build, and verify committed runtime
        run: npm test && npm run typecheck && npm run build && npm run bundle
        working-directory: src

      - name: Confirm the committed runtime matches source
        run: |
          git diff --exit-code -- function-package/index.cjs
          diff --strip-trailing-cr src/host.json function-package/host.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: src

      - name: Validate PowerShell and run PowerShell tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parseErrors = @()
          $powerShellFiles = @(Get-ChildItem ./scripts -Recurse -Include *.ps1,*.psm1 -File)
          foreach ($file in $powerShellFiles) {
            $tokens = $null
            $fileErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$fileErrors
            )
            $parseErrors += $fileErrors
          }
          if ($parseErrors) {
            $parseErrors | Format-List
            throw 'PowerShell syntax validation failed.'
          }

          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          $analysis = @(Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error)
          if ($analysis) {
            $analysis | Format-Table -AutoSize
            throw 'PSScriptAnalyzer reported one or more errors.'
          }

          $pesterTests = @(Get-ChildItem ./tests -Recurse -Filter *.Tests.ps1 -File -ErrorAction SilentlyContinue)
          if ($pesterTests.Count -gt 0) {
            Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
            $result = Invoke-Pester -Path ./tests -Output Detailed -PassThru
            if ($result.FailedCount -gt 0) { throw 'One or more Pester tests failed.' }
          } else {
            Write-Host 'No PowerShell Pester tests are present.'
          }

      - name: Build Bicep and validate generated ARM JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          az bicep install --version v0.46.1
          az bicep build --file infra/main.bicep
          if ($LASTEXITCODE -ne 0) { throw 'Bicep build failed.' }
          Get-Content ./infra/main.json -Raw | ConvertFrom-Json | Out-Null
          git diff --exit-code -- infra/main.json

      - name: Validate metadata and local documentation links
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content ./.azd/catalog.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content ./infra/main.parameters.json -Raw | ConvertFrom-Json | Out-Null

          $missing = [System.Collections.Generic.List[string]]::new()
          $markdown = @(Get-Item ./README.md) + @(Get-ChildItem ./docs -Filter *.md -File)
          foreach ($file in $markdown) {
            $lineNumber = 0
            foreach ($line in Get-Content $file.FullName) {
              $lineNumber++
              foreach ($match in [regex]::Matches($line, '\[[^\]]+\]\(([^)#]+)(?:#[^)]+)?\)')) {
                $target = $match.Groups[1].Value
                if ($target -notmatch '^(https?://|mailto:)') {
                  $resolved = Join-Path $file.DirectoryName $target
                  if (-not (Test-Path -LiteralPath $resolved)) {
                    $missing.Add("$($file.FullName):$lineNumber -> $target")
                  }
                }
              }
            }
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Error $_ }
            throw 'Local documentation link validation failed.'
          }
