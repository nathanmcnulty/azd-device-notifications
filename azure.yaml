name: azd-device-notifications
metadata:
  template: azd-device-notifications@0.1.0
requiredVersions:
  azd: ">= 1.23.0"
infra:
  provider: bicep
  path: infra
hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/Pre-Provision.ps1
    interactive: true
    continueOnError: false
  postprovision:
    shell: pwsh
    run: ./scripts/Post-Provision.ps1
    interactive: true
    continueOnError: false
  predeploy:
    shell: pwsh
    run: ./scripts/Deploy-FunctionPackage.ps1
    interactive: false
    continueOnError: false
  postdeploy:
    shell: pwsh
    run: ./scripts/Test-Deployment.ps1
    interactive: false
    continueOnError: false
  predown:
    shell: pwsh
    run: ./scripts/Remove-TenantObjects.ps1
    interactive: true
    continueOnError: false
